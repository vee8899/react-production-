name: Build container

on:
  workflow_call:
    inputs:
      verified_sha:
        required: true
        type: string

jobs:
  build:
    name: Build and publish container
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.verified_sha == github.sha }}
    concurrency:
      group: publish-automation-platform
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verified_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: ghcr.io/vee8899/automation-platform:${{ inputs.verified_sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=${{ vars.VITE_SENTRY_ENVIRONMENT }}
            VITE_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
      - name: Promote only the current main commit
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: node scripts/promote-image.mjs
